; Article .docx uploads are fixed at 10 MB. PHP must allow at least that
; (shared hosts often default to 2M; 64M leaves headroom for the multipart form).
; Do not cap RAM or script time here — that can lower Hostinger
; defaults (512M / 300s) and OOM or kill evaluation in the same request.
max_input_vars = 10000
post_max_size = 64M
upload_max_filesize = 64M
max_input_time = 120
pcre.backtrack_limit = 10000000
pcre.recursion_limit = 100000
