<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>Animated icon sheet</title>
<style>
  html,body{margin:0;background:#f4f7f7}
  .wrap{padding:28px 32px;max-width:1100px;margin:0 auto}
  .grid{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:14px}
  .tile{
    background:#fff;border:1px solid #d7e3e3;border-radius:14px;aspect-ratio:1;
    display:flex;align-items:center;justify-content:center;padding:16px;color:#1a585e;
    transition:transform .2s,border-color .2s;
  }
  .tile:hover{transform:scale(1.06);border-color:#1a585e}
  .tile svg{width:56px;height:56px;overflow:visible}
  .tile.brand svg{width:44px;height:44px}
  .tile svg path,.tile svg circle,.tile svg line,.tile svg polyline,.tile svg rect,.tile svg ellipse{
    stroke:currentColor;fill:none;
  }
  .m-draw svg path,.m-draw svg circle,.m-draw svg line,.m-draw svg polyline,.m-draw svg rect{
    stroke-dasharray:64;stroke-dashoffset:0;
  }
  .m-draw:hover svg path,.m-draw:hover svg circle,.m-draw:hover svg line,.m-draw:hover svg polyline,.m-draw:hover svg rect{
    animation:draw .7s ease both;
  }
  .m-spin:hover svg{animation:spin .9s linear infinite}
  .m-pulse:hover svg{animation:pulse .7s ease-in-out infinite;transform-origin:center}
  .m-bounce:hover svg{animation:bounce .7s ease-in-out infinite}
  .m-wiggle:hover svg{animation:wiggle .45s ease-in-out infinite;transform-origin:center}
  @keyframes draw{from{stroke-dashoffset:64}to{stroke-dashoffset:0}}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
  @keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
  @keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-12deg)}75%{transform:rotate(12deg)}}
</style>
